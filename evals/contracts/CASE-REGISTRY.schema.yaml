schema_version: "1.0"
schema_id: "meta-flow.case-registry"
kind: "contract-schema"
owner: "FEAT-WORKFLOW-EVAL-GOVERNANCE"
required_top_level_keys:
  - "schema_version"
  - "registry_id"
  - "cases"
fields:
  registry_id:
    type: "string"
    required: true
  coverage_matrix:
    type: "path"
    required: false
  cases:
    type: "list"
    required: true
    item_required_fields:
      - "id"
      - "title"
      - "category"
      - "target"
      - "graders"
      - "expected_result"
    optional_item_fields:
      - "blocking"
      - "severity"
      - "owner"
      - "runtime_required"
      - "requires_authorization"
      - "regression_asset"
      - "source_issue"
      - "coverage_status"
      - "last_verified_at"
    allowed_category_values:
      - "smoke"
      - "positive"
      - "negative"
      - "regression"
      - "security"
      - "permission"
      - "failure-recovery"
      - "multi-run"
      - "style"
      - "efficiency"
      - "governance"
      - "artifact-schema"
      - "negative-control"
      - "runtime"
      - "feedback"
      - "install"
    allowed_severity_values:
      - "BLOCKER"
      - "HIGH"
      - "MEDIUM"
      - "LOW"
    allowed_coverage_status_values:
      - "covered"
      - "uncovered"
      - "partial"
      - "needs-triage"
gotchas:
  - "Cases must reference grader ids that exist in WORKFLOW-EVAL.yaml."
  - "A passing case without trace metadata is incomplete for CP7 evidence."
  - "Regression cases should remain stable and deterministic by default."
  - "blocking=true means a non-PASS case blocks release-check even when the suite contains other passing cases."
  - "runtime_required=true requires at least one passing runtime_artifact grader result before release readiness can be complete."
  - "source_issue without regression_asset keeps the suite incomplete until the feedback issue is converted into an eval asset or explicitly triaged elsewhere."
