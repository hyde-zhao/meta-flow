schema_version: "1.0"
schema_id: "meta-flow.workflow-eval"
kind: "contract-schema"
owner: "FEAT-WORKFLOW-EVAL-GOVERNANCE"
required_top_level_keys:
  - "schema_version"
  - "suite_id"
  - "sut"
  - "prompt_bundle"
  - "case_registry"
  - "trace_policy"
  - "graders"
fields:
  suite_id:
    type: "string"
    required: true
    description: "Stable evaluation suite identifier."
  sut:
    type: "object"
    required: true
    required_fields:
      - "type"
      - "manifest"
    allowed_type_values:
      - "code-project"
      - "generated-workflow"
      - "prompt-skill-workflow"
      - "meta-flow-core-code"
      - "agentic-code-product"
      - "mixed"
  prompt_bundle:
    type: "path"
    required: true
    description: "Relative path to PROMPT-BUNDLE.yaml."
  case_registry:
    type: "path"
    required: true
    description: "Relative path to CASE-REGISTRY.yaml."
  trace_policy:
    type: "object"
    required: true
    required_fields:
      - "secret_masking"
      - "retained_fields"
      - "forbidden_fields"
  graders:
    type: "list"
    required: true
    item_required_fields:
      - "id"
      - "type"
    optional_item_fields:
      - "mode"
      - "authorization"
      - "blocking_policy"
    allowed_type_values:
      - "required_fields"
      - "forbidden_patterns"
      - "path_exists"
      - "prompt_bundle_hashes"
      - "case_registry_links"
      - "eval_config_non_empty"
      - "manifest_bundle_consistency"
      - "content_schema"
      - "state_machine"
      - "gate_contract"
      - "phase_skill_chain"
      - "hard_stop_confirmation"
      - "artifact_trace_schema"
      - "candidate_decision_integrity"
      - "deliverable_exact_schema"
      - "table_structure"
      - "table_schema"
      - "runtime_artifact"
      - "install_mapping"
    allowed_mode_values:
      - "static"
      - "runtime"
      - "human-review"
      - "external"
    allowed_authorization_values:
      - "none"
      - "local-fs"
      - "git-read"
      - "git-write"
      - "llm"
      - "network"
    allowed_blocking_policy_values:
      - "always"
      - "on-release"
      - "advisory"
  feedback_sources:
    type: "list"
    required: false
    item_required_fields:
      - "id"
      - "type"
    allowed_type_values:
      - "local"
      - "git"
      - "gitlab"
      - "archive"
      - "ci-artifact"
      - "run-exec"
    description: "Generic field feedback sources consumed by `meta-flow eval feedback pull|sync|normalize|triage|analyze`."
  release_policy:
    type: "object"
    required: false
    description: "Optional release thresholds consumed by release-check."
grader_type_fields:
  runtime_artifact:
    optional_fields:
      - "workspace"
      - "sample_registry"
      - "sample_ids"
      - "profile"
      - "state_path"
      - "skill_calls_path"
      - "expected_phase"
      - "expected_status"
      - "expected_blocked"
      - "required_paths"
      - "required_skill_calls"
      - "required_gates"
      - "phase_order"
      - "phase_paths"
      - "phases"
      - "min_phase_chars"
      - "trace_chains"
      - "required_patterns"
      - "forbidden_patterns"
      - "placeholder_patterns"
      - "target_globs"
      - "min_tables"
    description: "Checks existing runtime workspaces directly or via RUNTIME-SAMPLE-REGISTRY.yaml."
  install_mapping:
    optional_fields:
      - "platform"
      - "scope"
      - "agent"
      - "expected_skills"
      - "expected_rules"
      - "manifest_path"
      - "installed_root"
      - "target_root"
      - "platform_contracts"
      - "allowed_agents"
      - "allowed_skills"
    description: "Checks install manifests, dry-run output, installed roots, and optional platform contract paths."
gotchas:
  - "WORKFLOW-EVAL.yaml defines the suite contract; it is not run evidence."
  - "External LLM/SaaS graders must be optional adapters and require runtime_authorization."
  - "Pure code projects may use sut.type=code-project and skip workflow-only graders."
  - "runtime_artifact graders read an existing runtime workspace; they do not execute agents by themselves."
  - "sample_registry/sample_ids are preferred for release-grade runtime evidence; direct workspace config remains supported for small local fixtures."
  - "install_mapping graders must reuse install manifests, dry-run output, or installed roots instead of reimplementing platform installation."
