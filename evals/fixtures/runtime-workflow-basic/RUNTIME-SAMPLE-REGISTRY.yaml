      - "process/STATE.yaml"
      - "process/execution/SKILL-CALLS.yaml"
      - "process/checkpoints/GATE-2.md"
      - "process/checkpoints/GATE-3.md"
      - "process/checkpoints/GATE-4.md"
      - "kym/KYM.md"
      - "mfq/MFQ.md"
      - "ppdcs/PPDCS.md"
      - "delivery/README.md"
      - "delivery/TRACE.md"
      - "delivery/COVERAGE.md"
    required_skill_calls:
      - "requirement-extraction"
      - "scenario-expansion"
      - "hld-designer"
      - "implementation-execution"
      - "verification-execution"
      - "deliverable-renderer"
    required_gates: ["GATE-2", "GATE-3", "GATE-4"]
    target_globs: ["kym/*.md", "mfq/*.md", "ppdcs/*.md", "delivery/*.md", "process/**/*.md", "process/**/*.yaml"]
    required_patterns: ["trace_id", "normal_path", "coverage"]
    min_tables: "2"
    min_phase_chars: "80"
    phase_order: ["KYM", "MFQ", "PPDCS", "delivery"]
