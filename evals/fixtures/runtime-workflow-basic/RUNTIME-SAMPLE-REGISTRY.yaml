      - "KYM=kym/KYM.md"
      - "MFQ=mfq/MFQ.md"
      - "PPDCS=ppdcs/PPDCS.md"
      - "delivery=delivery/README.md"
    trace_chains:
      - "SR -> TSP -> LC -> TD -> PC"
  - id: "RT-GENERIC-BLOCKED-20260617"
    profile: "partial"
    workspace: "runtime/workspace-blocked"
