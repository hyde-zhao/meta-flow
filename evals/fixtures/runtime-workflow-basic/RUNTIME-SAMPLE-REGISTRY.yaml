    state_path: "process/STATE.yaml"
    required_paths:
      - "process/STATE.yaml"
      - "process/RUN-EXEC.md"
    target_globs: ["process/*.md", "process/*.yaml"]
    blocked_patterns: ["BLOCKED", "blocked_by"]
