schema_version: "1.0"
registry_id: "runtime-workflow-basic-samples"
samples:
  - id: "RT-GENERIC-FULL-20260617"
    profile: "full"
    workspace: "runtime/workspace-basic"
    expected_status: "PASS"
    state_path: "process/STATE.yaml"
    skill_calls_path: "process/execution/SKILL-CALLS.yaml"
    expected_phase: "delivered"
