[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-flow"
version = "0.4.0"
description = "Meta Flow workflow asset installer and delivery package"
readme = "delivery/README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
meta-flow = "meta_flow.cli:main"

[tool.setuptools]
packages = ["meta_flow"]
