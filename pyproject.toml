[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-flow"
version = "1.1.0"
description = "Meta Flow — AI project operating system with spec-driven delivery"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "hyde-zhao" }]
keywords = ["meta-flow", "project-management", "spec-driven-development", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0.2,<7"]

[project.scripts]
mf = "meta_flow.cli:main"

[project.urls]
Homepage = "https://github.com/hyde-zhao/meta-flow"
Repository = "https://github.com/hyde-zhao/meta-flow"
Issues = "https://github.com/hyde-zhao/meta-flow/issues"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]
