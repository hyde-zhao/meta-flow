[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-flow"
version = "0.4.1"
description = "Meta Flow workflow asset installer and delivery package"
readme = "delivery/README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.2,<7",
]

[project.scripts]
meta-flow = "meta_flow.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["meta_flow", "meta_flow.*", "delivery", "delivery.scripts"]
namespaces = true

[tool.setuptools.package-data]
delivery = ["**/*.md", "**/*.yaml", "**/*.json", "**/*.sh", "**/*.ps1", "**/*.py"]
"meta_flow.execution_control" = ["provider/*.json"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]
