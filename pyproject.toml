[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-flow"
version = "0.1.0"
description = "Meta Flow — AI project operating system with spec-driven delivery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0.2,<7"]

[project.scripts]
mf = "meta_flow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]
