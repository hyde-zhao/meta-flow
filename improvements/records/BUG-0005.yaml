acceptance:
- mf dev install --yes 在源码版本号不变但代码有变更时，全局工具仍更新到源码 HEAD（例如传 --reinstall 或等价强制重建缓存）。
- 安装后自检：以子进程执行 mf --help/关键命令或比较构建标识，与源码不一致时非零退出并提示，不静默成功。
- 回归用例：模拟版本号不变、源码新增命令的场景，断言安装后新命令可用（覆盖 --reinstall 参数或缓存失效逻辑）。
