id: MFP-0029
title: mf dev install 对同版本源码复用 uv 缓存，静默返回成功但代码未更新
status: submitted
priority: must
category: feature
classification: bug
source:
  project: meta-flow
  role: manager
  created_by: manager
  created_at: '2026-11-26T07:22:30.000000+00:00'
  mf_version: 0.1.1
  platform: linux
