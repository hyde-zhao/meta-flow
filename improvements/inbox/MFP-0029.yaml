problem: 'dev_install 执行 uv tool install --force <source>；当源码 pyproject 版本号不变时

  （MFP-0028 场景：1.0.1 仍为 0.1.1），uv 复用旧缓存构建，命令返回成功但全局工具环境仍是

  旧代码。升级流程假成功，按 RELEASE-NOTES 流程升级的用户会运行旧代码且无法察觉。'
context:
  scenario: '本机 0.1.1 到 1.0.1 升级：git 更新到 1eed907 后执行 mf dev install --yes 返回

    “已从源码安装全局 mf”，但 mf task --help 不含 rework，site-packages 的 cli.py 中

    rework 出现 0 次；先执行 UV_NO_CACHE=1 mf dev install --yes 后才真正更新

    （rework 出现 20 次，mf task rework 可用）。'
  reproduction:
  - 源码 HEAD 已包含新命令（mf task rework），pyproject version 不变（仍 0.1.1）。
  - 执行 mf dev install --yes，返回成功。
  - mf task --help 无 rework；grep -c rework site-packages/meta_flow/cli.py 计数 0。
  - 执行 UV_NO_CACHE=1 mf dev install --yes 后重新检查，rework 计数 20，命令可用。
  expected: 'mf dev install --yes 在任何源码状态（版本号是否变化）下都确保全局工具代码与源码 HEAD

    一致；或检测到代码未变化时显式提示/失败，不得静默假成功。'
  actual: 静默假成功，需手动加 UV_NO_CACHE=1 才生效；首次安装后命令行为与源码不符。
  evidence:
  - '首次输出：已从源码安装全局 mf: /home/hyde/projects/meta-flow/meta-flow；随后 mf task --help 无
    rework'
  - grep -c rework .../site-packages/meta_flow/cli.py 结果 0（首次）/ 20（UV_NO_CACHE=1 后）
  - global_store.py dev_install 使用 uv tool install --force <source>，未传 --reinstall
  affected:
  - src/meta_flow/global_store.py（dev_install）
  - RELEASE-NOTES 升级流程（mf dev update 后 mf dev install --yes）
  - 所有以同版本号迭代源码的 maintainer 升级场景
acceptance:
- mf dev install --yes 在源码版本号不变但代码有变更时，全局工具仍更新到源码 HEAD（例如传 --reinstall 或等价强制重建缓存）。
- 安装后自检：以子进程执行 mf --help/关键命令或比较构建标识，与源码不一致时非零退出并提示，不静默成功。
- 回归用例：模拟版本号不变、源码新增命令的场景，断言安装后新命令可用（覆盖 --reinstall 参数或缓存失效逻辑）。
testing_plan: '单测 mock _run 断言 uv 参数包含 --reinstall；或在临时环境中构建、安装、校验新命令；

  集成测试使用同一版本号连续迭代两次源码并验证第二次生效。'
rollback: 仅安装行为变更，无迁移风险。
