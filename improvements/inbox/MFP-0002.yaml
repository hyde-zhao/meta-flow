problem: workspace init 固定生成 R1/v1 MVP 与 R1/P1，且只能新建 contract，无法接入已存在的 contract 仓；本机接入已有
  meta-flow-contract 只能手工写 workspace.yaml + link。
context:
  scenario: 存量 0.x/R0 项目接入 meta-flow；跨机 clone 已有 contract 后建立工作区。
  reproduction:
  - mf workspace init --name meta-flow --contract-dir meta-flow-contract（contract
    已存在）
  - 在存量项目 init 后运行 mf status，看到 R1/P1
  expected: init 可声明/导入 R0/0.1.1 基线；attach 已有 contract 生成 workspace.yaml、mf.workspace.yaml
    与根链接。
  actual: init 拒绝已存在目录；默认生成 R1/P1；需手工修正与注册。
  evidence:
  - 'BUG-0002: init 固定 R1/P1'
  - 'BUG-0006: 已有 contract 无法接入'
  - R0-P4-T003/T010
  affected:
  - src/meta_flow/workspace.py
  - src/meta_flow/cli.py
acceptance:
- id: A1
  method: artifact
  expect: init 可指定或推导既有 R0/0.x roadmap/phase/version，不产生错误 R1/P1。
- id: A2
  method: artifact
  expect: attach 已有 contract 生成 workspace.yaml、mf.workspace.yaml、根 CLAUDE.md/README
    链接，且不覆盖 contract 内容。
- id: A3
  method: artifact
  expect: 回归测试覆盖空 contract 与已有 contract 两条路径；mf doctor 通过。
testing_plan: uv run pytest tests/test_workspace.py tests/test_cli.py；CLI smoke：init
  空目录、attach 已有 contract、mf status。
rollback: 回滚 init 默认值/attach 命令；保留手工注册路径。
