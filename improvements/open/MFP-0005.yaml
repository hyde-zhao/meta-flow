problem: mf workspace link 重写根 CLAUDE.md/README 后未刷新 install.yaml 的 CLAUDE.md digest；维护者模板仍写
  mf doctor --project，而 0.1.1 只支持 --path/--global。
context:
  scenario: workspace 初始化后运行 link/sync；maintainer 按模板执行体检命令。
  reproduction:
  - mf install claude && mf workspace link
  - 比较 .meta-flow/install.yaml 中 CLAUDE.md digest 与实际文件
  - 运行 mf doctor --project
  expected: link 后 digest 与实际一致；模板使用 mf doctor --path/--global。
  actual: digest 仍为 link 前内容；mf doctor --project 报 unrecognized arguments。
  evidence:
  - BUG-0007
  - BUG-0008
  - R0-P4-T011
  affected:
  - src/meta_flow/workspace.py
  - src/meta_flow/install.py
  - agents/maintainer.md
  - src/meta_flow/templates.py
