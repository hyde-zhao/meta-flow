      use_cases: [UC-SCOPE-AMENDMENT]
      stories: [ST-N-MF2]
    trigger: "BL-001 supersession admission 未通过，或 apply 时 revision/preimage 已漂移或 delta 含 unknown path"
    context: "plan 快照不可复用"
    preconditions: ["原 revision bytes 摘要已记录"]
    steps:
      - action: "尝试 apply scope-amend"
        expected: "MF-2 实现/E2E 或 apply 被拒绝并给出重新 plan/补齐 predecessor inventory 指引，不产生 partial revision"
    evidence_type: automated
    automation_status: planned
    gap_reason: ""
