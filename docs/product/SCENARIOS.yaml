    title: "on-touch obligations 缺失时预检拒绝计划"
    type: precheck
    priority: HIGH
    persona: P-02
    source_refs:
      requirements: [REQ-MF1-02]
      use_cases: [UC-WORK-PREFLIGHT]
      stories: [ST-N-MF1]
    trigger: "计划会触碰需同步的治理对象但未声明 obligation"
    context: "主输入合法，on-touch closure 不完整"
    preconditions: ["on-touch policy 可读"]
    steps:
      - action: "执行 preflight obligation scan"
        expected: "列出缺失 obligation 和补齐入口，mutation=0"
    evidence_type: automated
    automation_status: planned
    gap_reason: ""
  - id: SCN-MF2-01
    title: "合法 scope delta 生成 append-only 新 revision"
    type: positive
    priority: HIGH
    persona: P-01
    source_refs:
      requirements: [REQ-MF2-01, REQ-MF2-02, REQ-MF2-03]
      use_cases: [UC-SCOPE-AMENDMENT]
      stories: [ST-MF2]
    trigger: "active Work 需要增加已获授权的读写或检查路径"
    context: "revision/preimage 一致且 delta 可分类"
    preconditions: ["BL-001 revision>1 legal supersession admission 已通过", "predecessor/inventory 可确定接纳", "typed authorization 覆盖 delta", "受影响证据可枚举"]
    steps:
      - action: "plan 后 apply scope-amend"
        expected: "MF-2 admission/E2E 先通过；旧 revision 不变，新 revision 含 delta、重新授权与 invalidation set"
    evidence_type: automated
    automation_status: planned
    gap_reason: ""
