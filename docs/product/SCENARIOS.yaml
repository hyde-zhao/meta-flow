scenarios:
  - id: SCN-MF1-01
    title: "合法 Work 初始化执行全生命周期零写预检"
    type: positive
    priority: HIGH
    persona: P-01
    source_refs:
      requirements: [REQ-MF1-01, REQ-MF1-02, REQ-MF1-03]
      use_cases: [UC-WORK-PREFLIGHT]
      stories: [ST-MF1]
    trigger: "维护者准备初始化 Work，但尚未 apply"
    context: "route、OID/preimage、scope、budget 和 typed refs 均合法"
    preconditions: ["只读预检已授权", "目标快照可读"]
    steps:
      - action: "以同一快照分别调用 preflight/apply 的 shared validation core，并捕获写集合摘要"
        expected: "normalized item/decision graph 100% 一致；preflight 返回 PASS、完整 lifecycle 模拟项和 mutation=0，差异仅限 orchestration/presentation"
    evidence_type: automated
    automation_status: planned
    gap_reason: ""
  - id: SCN-MF1-02
    title: "无效 revision/scope/budget 在 apply 前被零写阻断"
    type: negative
    priority: HIGH
    persona: P-01
    source_refs:
      requirements: [REQ-MF1-01, REQ-MF1-02, REQ-MF1-03]
      use_cases: [UC-WORK-PREFLIGHT]
      stories: [ST-N-MF1]
    trigger: "preflight 输入包含 stale revision、未闭合 scope 或超限 budget"
    context: "至少一个 lifecycle 前置项无效"
    preconditions: ["目标 bytes 快照已记录"]
    steps:
      - action: "以同一无效快照执行 preflight/apply shared-core validation 并比较前后摘要"
        expected: "两个入口返回相同 BLOCKED/FAIL item/error graph；preflight 所有目标 bytes 与 ledger/state 均不变"
    evidence_type: automated
    automation_status: planned
    gap_reason: ""
